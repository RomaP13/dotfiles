### OPTIONS ###

# Increase the scrollback buffer to 10,000 lines
set-option -g history-limit 10000

# Enable mouse support
set-option -g mouse on

# Move the status bar to the top of the terminal
set-option -g status-position top

# Override terminal capabilities to ensure proper 24-bit TrueColor support
set-option -sa terminal-overrides ',xterm*:RGB'

# Reduces the delay when sending escape sequences,
# making Vim feel more responsive in tmux (especially for <Esc>).
set -s escape-time 0

# Start window numbering at 1 instead of 0.
set -g base-index 1


### KEYBINDINGS ###

unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Copy Mode (Vim-style)
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

# Vim-like Pane Switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Split panes with o and e
unbind %
bind o split-window -h
unbind '"'
bind e split-window -v

# forget the find window.  That is for chumps
# bind-key -r f run-shell "tmux neww ~/.config/tmux/tmux-sessionizer"

### STATUS BAR ###

# Enable widgets and features
set -g @use_pywal_colors 1
set -g @show_git_status 1
set -g @show_uptime 1
set -g @show_datetime 1

# Load Pywal color overrides if enabled
if-shell '[ "$(tmux show-option -gv @use_pywal_colors 2>/dev/null)" = "1" ]' \
  'source-file ~/.cache/wal/colors-tmux.conf'

# Initialize status layout and theme
run-shell ~/.config/tmux/status.tmux

# Maybe?
# bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

### PLUGINS ###

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX Plugin Manager (TPM)
run '~/.tmux/plugins/tpm/tpm'
