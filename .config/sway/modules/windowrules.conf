for_window {
  # focus latest spawned window
  # [shell=".*"] focus

  # set all floating windows to center
  [floating] move position center; sticky disable

  # floating apps
  [app_id="(?i).*pavucontrol.*"] floating enable; move position center; resize set 70ppt 75ppt

  # xdg-desktop-portal
  # [app_id="(?i).*xdg-desktop-portal-gtk.*"] floating enable; move position center; resize set 70ppt 75ppt
  # [class="(?i).*xdg-desktop-portal-gtk.*"] floating enable; move position center; resize set 70ppt 75ppt

  # libreoffice
  # [app_id="(?i).*soffice.*" title="(?i).*open.*"] floating enable; move position center; resize set 70ppt 75ppt

  [app_id="(?i).*telegram.*" title="(?i).*choose file.*"] floating enable; move position center; resize set 70ppt 75ppt

  # qbittorrent
  [app_id="(?i).*qbittorrent.*"] floating enable; move position center
  [app_id="(?i).*qbittorrent.*" title="(?i).*select file to open.*"] floating enable; move position center; resize set 70ppt 75ppt
  [app_id="(?i).*qbittorrent.*" title="(?i).*open torrent file.*"] floating enable; move position center; resize set 70ppt 75ppt
  [app_id="(?i).*qbittorrent.*" title="(?i).*qbittorrent v.*"] floating disable

  # OBS
  [app_id=".*OBS.*"] floating enable; move position center
  [app_id=".*OBS.*" title=".*OBS.*"] floating disable

  # xarchiver
  [app_id="(?i).*xarchiver.*"] floating enable; move position center, resize set 70ppt 75ppt
 
  # Picture-in-Picture mode
  [app_id="librewolf" title="Picture-in-Picture"] {
    floating enable
      sticky enable
      resize set 640 360
      move position 1000 50
      border pixel 2
  }

  # different window types
  [window_type="dialog"] floating enable; move position center
  [window_type="utility"] floating enable; move position center
  [window_type="popup_menu"] floating enable; move position center

}
