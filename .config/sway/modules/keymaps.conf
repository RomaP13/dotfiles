### Workspaces

# Switch to workspace
bindsym --to-code $mod+1 workspace $ws1
bindsym --to-code $mod+2 workspace $ws2
bindsym --to-code $mod+3 workspace $ws3
bindsym --to-code $mod+4 workspace $ws4
bindsym --to-code $mod+5 workspace $ws5
bindsym --to-code $mod+6 workspace $ws6
bindsym --to-code $mod+7 workspace $ws7
bindsym --to-code $mod+8 workspace $ws8
bindsym --to-code $mod+9 workspace $ws9
bindsym --to-code $mod+0 workspace $ws0

# Toggle between workspaces
bindsym --to-code $mod+Tab workspace next_on_output
bindsym --to-code Mod1+Tab workspace prev_on_output

# Move focused container to workspace
bindsym --to-code $mod+Shift+1 move container to workspace $ws1
bindsym --to-code $mod+Shift+2 move container to workspace $ws2
bindsym --to-code $mod+Shift+3 move container to workspace $ws3
bindsym --to-code $mod+Shift+4 move container to workspace $ws4
bindsym --to-code $mod+Shift+5 move container to workspace $ws5
bindsym --to-code $mod+Shift+6 move container to workspace $ws6
bindsym --to-code $mod+Shift+7 move container to workspace $ws7
bindsym --to-code $mod+Shift+8 move container to workspace $ws8
bindsym --to-code $mod+Shift+9 move container to workspace $ws9
bindsym --to-code $mod+Shift+0 move container to workspace $ws0


### Window

# Change focus
bindsym --to-code $mod+h focus left
bindsym --to-code $mod+j focus down
bindsym --to-code $mod+k focus up
bindsym --to-code $mod+l focus right

# Move windows
bindsym --to-code $mod+Shift+h move left
bindsym --to-code $mod+Shift+j move down
bindsym --to-code $mod+Shift+k move up
bindsym --to-code $mod+Shift+l move right

# Focus parent container
bindsym --to-code $mod+a focus parent

# Kill window
bindsym --to-code $mod+q kill

# Resize window
mode "resize" {
    bindsym --to-code h resize shrink width  20px or 5 ppt
    bindsym --to-code j resize grow   height 20px or 5 ppt
    bindsym --to-code k resize shrink height 20px or 5 ppt
    bindsym --to-code l resize grow   width  20px or 5 ppt

    # Return to default mode
    bindsym --to-code Return mode "default"
    bindsym --to-code Escape mode "default"
}
bindsym --to-code $mod+r mode "resize"


### Layout stuff

# Split
bindsym --to-code $mod+Shift+s splith
bindsym --to-code $mod+Shift+v splitv

# Clear container mode and remove the header
bindsym --to-code $mod+Shift+d layout toggle split

# Switch the current container between different layout styles
bindsym --to-code $mod+s layout stacking
bindsym --to-code $mod+w layout tabbed

# Make the current focus fullscreen
bindsym --to-code $mod+f fullscreen


### Floating

# Drag floating windows by holding down $mod and left mouse button.
# Resize them with right mouse button + $mod.
# Despite the name, also works for non-floating windows.
floating_modifier $mod normal

# Toggle the current focus between tiling and floating mode
bindsym --to-code $mod+Shift+space floating toggle; [floating con_id="__focused__"] move position center; [floating con_id="__focused__"] resize set 70ppt 75ppt

# Swap focus between the tiling area and the floating area
bindsym --to-code $mod+space focus mode_toggle

# Center and rezize floating area
bindsym --to-code $mod+Shift+y [floating con_id="__focused__"] move position center;[floating con_id="__focused__"] resize set 70ppt 75ppt


### Scratchpad

# Move the currently focused window to the scratchpad
bindsym --to-code $mod+Shift+minus move scratchpad

# Show the next scratchpad window or hide the focused scratchpad window.
# If there are multiple scratchpad windows, this command cycles through them.
bindsym --to-code $mod+minus scratchpad show


### Sway stuff

# Reload the configuration file
bindsym --to-code $mod+Shift+c reload

# Exit sway (logs you out of your Wayland session)
bindsym --to-code $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'


### System apps

bindsym --to-code $mod+Return exec $terminal
bindsym --to-code $mod+b exec $browser -P
bindsym --to-code $mod+e exec $filemanager 
bindsym --to-code $mod+d exec $menu
bindsym --to-code $mod+o exec $pdfreader
bindsym --to-code $mod+p exec $audiosettings
bindsym --to-code $mod+Delete exec $taskmanager
bindsym --to-code $mod+Shift+x exec $idle

bindsym --to-code $mod+Shift+b exec $browser -P Work --name librewolf-work
bindsym --to-code $mod+Shift+n exec $browser -P Home --name librewolf-home

### Utilities

bindsym --to-code $mod+i exec $toggle_input_remapper
bindsym --to-code $mod+Shift+i exec $toggle_input_remapper force
bindsym --to-code $mod+x exec $toggle_mic
bindsym --to-code $mod+Ctrl+Insert exec $wallpapermenu

bindsym --to-code $mod+Ctrl+equal exec $brightness +10
bindsym --to-code $mod+Ctrl+minus exec $brightness -10

bindsym --to-code $mod+Insert exec $full_screenshot
bindsym --to-code $mod+Shift+Insert exec $area_screenshot
