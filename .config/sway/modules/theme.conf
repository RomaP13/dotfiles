# Borders
default_floating_border pixel 3
default_border pixel 3
hide_edge_borders --i3 smart  # Hides the title bar on tabbed/stacked containers when only 1 window is left

# Gaps
gaps inner 10
gaps outer 0
smart_gaps off  # Set to 'on' if you want no gaps for single windows

# Misc
workspace_layout default
mouse_warping none
seat * hide_cursor 5000
focus_follows_mouse no
focus_wrapping no

# Target Sway Windows: class | border | backgr | text | indicator | child_border
client.focused          $color4    $color4    $color0    $color4       $color4
client.focused_inactive $color8    $color8    $color0    $color8       $color8
client.unfocused        $color0    $color0    $color0    $color0       $color0
