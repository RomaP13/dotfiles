set $mod Mod4

# Workspaces
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws0 "0"

# Colors
set $bg #222222
set $fg #d8a657
set $ur #ea6962
set $uf #a89984

# System apps
set $terminal kitty
set $browser librewolf
set $filemanager thunar
set $menu kickoff
set $pdfreader zathura
set $audiosettings pavucontrol
set $taskmanager xfce4-taskmanager

# Custom scripts
set $swaybar ~/.local/bin/swaybar_status

set $toggle_input_remapper ~/.local/bin/toggle_input_remapper
set $toggle_mic ~/.local/bin/toggle_mic

set $wallpapermenu ~/.local/bin/wallpapermenu
set $brightness ~/.local/bin/brightness

set $full_screenshot ~/.local/bin/screenshot_full
set $area_screenshot ~/.local/bin/screenshot_area
